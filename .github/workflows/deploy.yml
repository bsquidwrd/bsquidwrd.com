name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Called by refresh-projects.yml, whose own push cannot trigger this workflow:
  # GitHub does not raise workflow events for pushes made with GITHUB_TOKEN.
  workflow_call:

# Allow the job to clone the repo and create a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch head, not github.sha. When refresh-projects.yml calls
      # this workflow, github.sha is the commit from before its refresh commit, so
      # the default would build and publish the content it just replaced.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # include-hidden-files matches what withastro/action did, so a dotfile added
      # to the build output later does not silently go missing from the deploy.
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  prune:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Prune old workflow runs
        uses: ./.github/actions/prune-runs
